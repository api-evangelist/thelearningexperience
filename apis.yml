name: The Learning Experience
description: 'The Learning Experience is an early childhood education and childcare
  franchise operating academies of early education for children from six weeks to
  six years old across a nationwide network of centers. Its programs span infant,
  toddler, preschool, and pre-kindergarten care built on a proprietary curriculum.
  The company was surfaced as a portfolio company of Norwest Venture Partners and
  added to the API Evangelist network. As a consumer-facing childcare operator it
  publishes no public developer or API surface; this profile captures its identity,
  public web properties, and probed domain security posture.'
